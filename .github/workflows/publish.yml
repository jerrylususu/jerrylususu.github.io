name: Publish Nekonull's Blog

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # .Lastmod and contributor facts need history; keep it complete.
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # OINK declares Hugo Extended 0.160.1 as its floor; the theme is
          # built and validated against the 0.165.0 toolchain.
          hugo-version: '0.165.0'
          extended: true

      # The theme is vendored at themes/oink, so no submodules and no Go
      # module resolution are involved.
      - name: Build
        run: >-
          hugo --cleanDestinationDir --gc --minify --environment production
          --printPathWarnings --panicOnWarning

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Keeps the hand-maintained sub-apps that live only on the publish
          # branch (cococlock, showbitflag, day-tracker, mainonly, 50, ...).
          keep_files: true
          publish_branch: publish
